name: nix
on:
  push:
    branches: [main]
  pull_request:

# Keeps the flake packaging honest: each job builds one package variant and
# runs the repo's test suite against the installed result (see flake.nix).
# The wheel job is what errors when a release bumps `version` without the
# wheel URL/hash in nix/wheel.nix (or vice versa); the from-source job
# exercises the full no-prebuilt-artifacts path (Core kernel compile).
jobs:
  wheel:
    strategy:
      matrix:
        # one runner per wheel arch (same split as release.yml)
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Repackage the PyPI wheel and run the test suite against it
        run: nix build ".#checks.${{ matrix.system }}.wheel" -L

  from-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build from source (compiles Core's kernel) and run the test suite against it
        run: nix build .#checks.x86_64-linux.from-source -L
