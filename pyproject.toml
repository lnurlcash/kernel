[build-system]
requires = ["scikit-build-core>=0.10", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "lnurlcash-kernel"
dynamic = ["version"]
description = "Verify LUD-25 ct1 (taproot script-path) spends with Bitcoin Core's own script interpreter, unmodified."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # deliberately none: a verification library keeps its own dependency surface at zero

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
# the version comes from the git tag, exactly like electrum-client's hatch-vcs
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.packages = ["src/lnurlcashkernel"]
wheel.py-api = "py3"          # pure-ctypes: one wheel per platform, not per Python
cmake.build-type = "Release"
build-dir = "build/skbuild"

[tool.setuptools_scm]
# tags are "v1.2.3" (see .github/workflows/release.yml); strip the "v"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
# PyPI rejects local versions ("0.1.0+g1234abc"), so never emit one - a dirty or
# untagged checkout gets a plain ".devN" instead, which builds fine but is not
# uploadable as a release
local_scheme = "no-local-version"
# lets `pip install .` work in a checkout with no tags yet (same reason
# electrum-client sets fallback_version)
fallback_version = "0.0.0"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.cibuildwheel]
# Wheels are built in manylinux containers (old glibc/libstdc++) so they run on
# real servers. A wheel built on a developer machine is NOT releasable: the
# one built during development needed manylinux_2_39, far too new.
build = "cp312-*"          # py3-none wheel: one interpreter build is enough
skip = "*-musllinux_*"
test-requires = "pytest"
# Core needs Boost >= 1.74 headers, but manylinux_2_28 (AlmaLinux 8) ships 1.66.
# Fetch a known version instead of trusting the distro.
before-all = "scripts/fetch_boost_headers.sh /tmp/boost-deps"
environment = { CMAKE_ARGS = "-DBoost_DIR=/tmp/boost-deps/boost-shim" }
# `-o pythonpath` overrides the default that would shadow the installed wheel with src/
test-command = "pytest {project}/tests -q -o pythonpath={project}/tests"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# each runner builds its own arch (ubuntu-latest = x86_64, ubuntu-24.04-arm = aarch64);
# listing both would make one runner try to emulate the other without QEMU
archs = ["native"]
